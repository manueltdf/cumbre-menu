<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de administración | Cumbre</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</head>
<body class="login-page">
    <main class="login-card" aria-label="Acceso de administración">
        <div class="login-brand">
            <img
                class="login-brand__logo"
                src="{{ url_for('static', filename='img/admin/cumbre-logo.png') }}"
                alt="Cumbre Resto Bar — Villa Traful"
                width="220"
                height="160"
            >
        </div>

        <form class="login-form" method="post" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="login-field">
                <label for="password">Contraseña</label>
                <div class="login-password">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Tu contraseña"
                        autocomplete="current-password"
                        autocapitalize="none"
                        spellcheck="false"
                        {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}
                        required
                    >
                    <button
                        class="login-password__toggle"
                        type="button"
                        aria-label="Mostrar contraseña"
                        aria-controls="password"
                        aria-pressed="false"
                        title="Mostrar contraseña"
                        hidden
                    >
                        <img src="{{ url_for('static', filename='img/login/eye.svg') }}" alt="" width="18" height="18">
                    </button>
                </div>
            </div>

            {% if error %}
                <p class="login-error" id="login-error" role="alert">{{ error }}</p>
            {% endif %}

            <button class="login-submit" type="submit">Acceder</button>
        </form>
    </main>
</body>
</html>
