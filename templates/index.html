<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumbre Restobar | Menú</title>
</head>
<body>
   <header>
    <h1>Cumbre Restobar</h1>
    <p>Villa Traful - Ruta 65</p>
   </header> 
   <main>
      <h2>Nuestro menú</h2>

    {% for producto in productos %}
        <article>
            <h3>{{ producto["nombre"] }}</h3>
            <p>$ {{ producto["precio"] }}</p>
        </article>
    {% else %}
        <p>No hay productos disponibles.</p>
    {% endfor %}
   </main>
</body>
</html>
