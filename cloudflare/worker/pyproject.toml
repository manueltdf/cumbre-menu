[project]
name = "cumbre-menu-staging"
version = "0.1.0"
description = "Flask menu app running on an isolated Cloudflare Worker"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "Flask-WTF==1.3.0",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
